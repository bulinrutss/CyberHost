# Gateway TLS+token local para o Port Proxy Manager (SEC-025).
# Escuta só em 127.0.0.1. O token fica em /etc/nginx/snippets/port-proxy-auth.conf.
server {
    listen 127.0.0.1:5443 ssl;
    server_name 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/port-proxy-local.crt;
    ssl_certificate_key /etc/nginx/certs/port-proxy-local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/port-proxy-auth.conf;

    location / {
        proxy_pass http://192.168.0.127:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header Authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
