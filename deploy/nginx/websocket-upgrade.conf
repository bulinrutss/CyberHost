# Restaura Upgrade/Connection se um proxy HTTP/1.0 na frente
# (ex. 192.168.0.127) removeu os headers hop-by-hop mas manteve
# Sec-WebSocket-Key. Precisa estar no contexto http (conf.d).
map $http_sec_websocket_key $ws_upgrade_header {
    ""      $http_upgrade;
    default websocket;
}

map $http_sec_websocket_key $ws_connection_header {
    ""      $connection_upgrade;
    default upgrade;
}
