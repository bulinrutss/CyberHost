server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ruts.dev _;

    client_max_body_size 25g;

    # HSTS/CSP/nosniff: o origin :80 envia para o Cloudflare Flexible reencaminhar no HTTPS.
    include /etc/nginx/snippets/security-headers.conf;

    # Cloudflare Flexible: HTTPS visitors arrive on origin :80 with
    # CF-Visitor scheme=https / X-Forwarded-Proto=https — do not 301 (loop).
    # Direct HTTP and CF HTTP visitors for ruts.dev go to https://ruts.dev.
    set $fwd_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $fwd_proto $http_x_forwarded_proto;
    }
    if ($http_cf_visitor ~* '"scheme":"https"') {
        set $fwd_proto https;
    }

    set $https_redirect 0;
    if ($host = ruts.dev) {
        set $https_redirect 1;
    }
    if ($host = www.ruts.dev) {
        set $https_redirect 1;
    }
    if ($http_x_forwarded_proto = https) {
        set $https_redirect 0;
    }
    if ($http_cf_visitor ~* '"scheme":"https"') {
        set $https_redirect 0;
    }
    if ($request_uri ~ "^/.well-known/acme-challenge/") {
        set $https_redirect 0;
    }
    if ($request_uri ~ "^/api/payments/webhook/") {
        set $https_redirect 0;
    }
    if ($https_redirect = 1) {
        return 301 https://ruts.dev$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ruts;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /api/payments/webhook/abacatepay {
        access_log off;
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $ws_upgrade_header;
        proxy_set_header Connection $ws_connection_header;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # add_header no location zera herança do server — reaplicar segurança + no-store.
        include /etc/nginx/snippets/security-headers.conf;
        # Não cachear API na borda/navegador (evita vazamento de sessão entre usuários).
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Vary "Cookie, Authorization" always;
    }

    location /cyberhost {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $ws_upgrade_header;
        proxy_set_header Connection $ws_connection_header;
    }

    location /financeiro {
        proxy_pass http://127.0.0.1:3000/cyberhost/financeiro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $ws_upgrade_header;
        proxy_set_header Connection $ws_connection_header;
    }

    # Sites sem domínio próprio: http://IP/s/nome/ (ou https://ruts.dev/s/nome/ após DNS)
    include /opt/host/data/web_sites/nginx/paths/*.conf;

    location / {
        root /var/www/ruts;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS na origem (Cloudflare Full / Full Strict). Sem este bloco, :443 cai no único
# vhost SSL (sites de clientes) e ruts.dev mostra página errada.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name ruts.dev www.ruts.dev;

    ssl_certificate /etc/letsencrypt/live/ruts.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruts.dev/privkey.pem;

    client_max_body_size 25g;

    include /etc/nginx/snippets/security-headers.conf;

    set $fwd_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $fwd_proto $http_x_forwarded_proto;
    }

    location ^~ /.well-known/acme-challenge/ {
