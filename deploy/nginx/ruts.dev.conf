        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Vary "Cookie, Authorization" always;
    }

    location /cyberhost {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $ws_upgrade_header;
        proxy_set_header Connection $ws_connection_header;
    }

    location /financeiro {
        proxy_pass http://127.0.0.1:3000/cyberhost/financeiro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $ws_upgrade_header;
        proxy_set_header Connection $ws_connection_header;
    }

    include /opt/host/data/web_sites/nginx/paths/*.conf;

    location / {
        root /var/www/ruts;
        try_files $uri $uri/ /index.html;
    }
}
