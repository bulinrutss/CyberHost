        proxy_set_header Upgrade $ws_upgrade_header;
        proxy_set_header Connection $ws_connection_header;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # add_header no location zera herança do server — reaplicar segurança + no-store.
        include /etc/nginx/snippets/security-headers.conf;
        # Não cachear API na borda/navegador (evita vazamento de sessão entre usuários).
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
